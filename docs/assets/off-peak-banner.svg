<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Off-Peak: cut the power bill without wrecking the evening</title>
  <desc id="desc">A dark blue banner with an electricity waveform and an appliance timeline moving work from peak to cheaper hours. Rules come before presence, and presence comes before price.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#14273A"/></linearGradient>
    <linearGradient id="mint" x1="762" y1="90" x2="1170" y2="277" gradientUnits="userSpaceOnUse"><stop stop-color="#6DD6FF"/><stop offset="1" stop-color="#52D6AA"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#6DD6FF" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#grid)"/>
  <path d="M35 83H60L72 54L86 107L101 72L111 83H137" stroke="url(#mint)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
