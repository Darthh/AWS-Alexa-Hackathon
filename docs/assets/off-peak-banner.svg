    <text x="783" y="211" fill="#C0D0E0" font-size="13">Dryer</text><rect x="1007" y="194" width="53" height="22" rx="6" fill="#6DD6FF" fill-opacity=".18" stroke="#6DD6FF"/>
    <text x="783" y="246" fill="#C0D0E0" font-size="13">Car + dishes</text><rect x="1117" y="229" width="78" height="22" rx="6" fill="#52D6AA" fill-opacity=".2" stroke="#52D6AA"/>
