    <text x="83" y="268" fill="#8CE7C6" font-size="15" font-weight="650">RULES  &gt;  PRESENCE  &gt;  PRICE</text>
    <text x="355" y="268" fill="#9DB1C9" font-size="15">Alexa+ simulator + real MCP tools</text>
    <rect x="758" y="50" width="464" height="242" rx="18" fill="#0B1423" stroke="#30455C"/>
    <text x="783" y="82" fill="#DAE7F2" font-size="14" font-weight="650">AN EVENING THAT STILL WORKS</text>
    <text x="884" y="115" fill="#8BA3BD" font-size="12">6 PM</text><text x="1000" y="115" fill="#8BA3BD" font-size="12">9 PM</text><text x="1110" y="115" fill="#8BA3BD" font-size="12">12 AM</text>
