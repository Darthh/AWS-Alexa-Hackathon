    <text x="60" y="163" fill="#F2F7FC" font-size="65" font-weight="750" letter-spacing="-2">Off-Peak</text>
    <text x="63" y="207" fill="#D0DFED" font-size="24">Cut my power bill without wrecking my evening.</text>
