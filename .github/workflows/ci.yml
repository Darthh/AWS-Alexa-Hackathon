name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: tou-rates standalone export
        run: |
          node scripts/export-tou-rates.mjs out/tou-rates
          cd out/tou-rates && npm install && npm test && npm run build
